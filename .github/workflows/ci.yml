# CI for uLLM (catalog F2). One job per part, all required on main:
#   core      Linux, no MLX: lint, format, types, every test that needs no model
#   mlx       macOS arm64: MLX device probe, the model, tests marked `mlx` (goldens)
#   router    Go vet, gofmt, tests with the race detector
#   terminal  generated contract types are fresh; strict typecheck
# Each job runs its `make ci-<job>` target, so `make ci` runs the same commands
# locally (decision 0007). Add a check to the target, not here.
# Actions are pinned to commit SHAs; the comment names the release.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.2"
  FORCE_COLOR: "1"

jobs:
  core:
    name: core (Linux, no MLX)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUFF_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: MLX is absent, so nothing below can depend on it
        run: uv run --locked python -c "import importlib.util as u, sys; sys.exit(u.find_spec('mlx') is not None)"
      - run: make ci-core

  mlx:
    name: mlx (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Probe MLX devices
        run: |
          uv run --locked python scripts/mlx_probe.py | tee mlx-probe.json
          {
            echo '### MLX on this runner'
            echo '```json'
            cat mlx-probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlx-probe
          path: mlx-probe.json
      - name: Cache models (keyed on the pinned revisions)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ hashFiles('src/ullm/models.py') }}
      - run: make ci-mlx

  router:
    name: router (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: router/go.mod
          cache: false # no dependencies yet, so no go.sum to key a cache on
      - run: make ci-router

  terminal:
    name: terminal (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: terminal/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: terminal/pnpm-lock.yaml
      - run: make ci-terminal
