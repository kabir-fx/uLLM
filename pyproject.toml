[project]
name = "ullm"
version = "0.0.0"
description = "A small, readable LLM inference engine for Apple Silicon, built on MLX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kabir" }]
requires-python = ">=3.12,<3.13"
# MLX runs only on Apple Silicon macOS. Everything else (ullm.core, FakeRunner,
# the contracts) must work without it, so CI's core job runs on Linux.
dependencies = [
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "huggingface-hub==2.4.0",
    "hypothesis==6.170.15",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "openai==3.51.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# --- ruff --------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PT",           # pytest style
    "TID",          # tidy imports, including the banned APIs below
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Rule 11: build the machinery, do not import it. These are mlx-lm's own
# generation loop, batching and caches; engine code must not use them.
# Tests and scripts may, because mlx-lm is the reference we compare against.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mlx_lm.generate".msg = "rule 11: mlx-lm's generation loop is the baseline, not a building block"
"mlx_lm.stream_generate".msg = "rule 11: mlx-lm's generation loop is the baseline, not a building block"
"mlx_lm.batch_generate".msg = "rule 11: mlx-lm's batching is the baseline, not a building block"
"mlx_lm.models.cache.BatchKVCache".msg = "rule 11: write our own KV cache"
"mlx_lm.models.cache.LRUPromptCache".msg = "rule 11: write our own prefix cache"
"mlx_lm.server".msg = "rule 11: mlx-lm's server is a baseline, not a building block"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]

# --- mypy --------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "."]
files = ["src", "tests", "scripts"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# mlx-lm ships no types. MLX does, but is absent on Linux, where mypy must
# still check the scripts and tests that import it.
[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the reference helpers in scripts/
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
markers = [
    "mlx: needs MLX and a downloaded model (Apple Silicon only)",
]
xfail_strict = true
