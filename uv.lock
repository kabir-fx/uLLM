    { name = "hypothesis" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "mlx", marker = "platform_machine == 'arm64' and sys_platform == 'darwin'", specifier = "==0.32.4" },
    { name = "mlx-lm", marker = "platform_machine == 'arm64' and sys_platform == 'darwin'", specifier = "==0.32.2" },
]

[package.metadata.requires-dev]
dev = [
    { name = "hypothesis", specifier = "==6.170.15" },
    { name = "mypy", specifier = "==2.4.1" },
    { name = "pytest", specifier = "==9.2.0" },
    { name = "ruff", specifier = "==0.17.5" },
]
